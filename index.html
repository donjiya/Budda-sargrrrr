<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Handwriting Work From Home</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:linear-gradient(135deg,#00c853,#008f46);
    min-height:100vh;
    color:#333;
    padding:18px 12px 95px;
}

.container{
    width:100%;
    max-width:680px;
    margin:auto;
}

/* TELEGRAM TOP BUTTON */

.telegram-btn{
    display:block;
    width:100%;
    text-align:center;
    text-decoration:none;
    background:#1688f5;
    color:white;
    font-size:20px;
    font-weight:800;
    padding:19px 10px;
    border-radius:50px;
    margin-bottom:22px;
    box-shadow:0 8px 20px rgba(0,0,0,.20);
}

/* MAIN CARD */

.card{
    background:white;
    border-radius:34px;
    padding:30px 18px 25px;
    box-shadow:0 12px 35px rgba(0,0,0,.18);
}

h1{
    text-align:center;
    color:#3b4252;
    font-size:36px;
    line-height:1.15;
    font-weight:800;
}

.subtitle{
    text-align:center;
    color:#087bd1;
    font-size:23px;
    font-weight:800;
    margin-top:18px;
    margin-bottom:30px;
}

/* FEATURES */

.features{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:18px 12px;
    margin-bottom:30px;
}

.feature{
    display:flex;
    align-items:center;
    gap:10px;
    font-size:16px;
    font-weight:700;
    color:#444;
}

.check{
    width:42px;
    height:42px;
    min-width:42px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#dff5e4;
    color:#159447;
    border-radius:9px;
    font-size:25px;
    font-weight:bold;
}

/* INNER CTA */

.cta-box{
    border:8px solid #10a38e;
    border-radius:28px;
    padding:22px 12px 16px;
}

.cta-button{
    display:block;
    text-align:center;
    text-decoration:none;
    background:#1488ed;
    color:white;
    padding:20px 8px;
    border-radius:50px;
    font-size:18px;
    font-weight:800;
    box-shadow:0 7px 18px rgba(0,100,200,.25);
}

.note{
    text-align:center;
    color:#777;
    font-size:13px;
    line-height:1.55;
    margin-top:14px;
}

/* OTHER BUTTONS */

.subscribe{
    display:block;
    text-align:center;
    text-decoration:none;
    color:white;
    font-size:19px;
    font-weight:800;
    padding:19px 10px;
    border-radius:50px;
    margin-top:18px;
    background:linear-gradient(135deg,#ffbd18,#ff8615);
    box-shadow:0 8px 20px rgba(0,0,0,.18);
}

/* HOW IT WORKS */

.section{
    background:white;
    margin-top:22px;
    border-radius:30px;
    padding:28px 18px;
    box-shadow:0 12px 30px rgba(0,0,0,.15);
}

.title{
    text-align:center;
    color:#087bd1;
    font-size:27px;
    font-weight:800;
    margin-bottom:25px;
}

.step{
    display:flex;
    gap:14px;
    margin-bottom:22px;
}

.step:last-child{
    margin-bottom:0;
}

.number{
    width:44px;
    height:44px;
    min-width:44px;
    border-radius:50%;
    background:#1488ed;
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:bold;
    font-size:17px;
}

.step h3{
    color:#333;
    font-size:17px;
    margin-bottom:4px;
}

.step p{
    color:#777;
    font-size:13px;
    line-height:1.5;
}

/* INFO */

.info{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    margin-top:22px;
}

.info-box{
    background:white;
    border-radius:20px;
    padding:20px 8px;
    text-align:center;
    box-shadow:0 8px 22px rgba(0,0,0,.12);
}

.info-box .icon{
    font-size:28px;
    margin-bottom:8px;
}

.info-box strong{
    display:block;
    font-size:14px;
}

.info-box small{
    color:#777;
    font-size:11px;
}

/* BOTTOM */

.bottom{
    background:white;
    border-radius:28px;
    padding:25px 16px;
    margin-top:22px;
    text-align:center;
    box-shadow:0 12px 30px rgba(0,0,0,.15);
}

.bottom h2{
    font-size:23px;
    color:#333;
    margin-bottom:8px;
}

.bottom p{
    color:#777;
    font-size:13px;
    margin-bottom:17px;
}

footer{
    color:white;
    text-align:center;
    font-size:11px;
    line-height:1.6;
    margin-top:24px;
}

/* STICKY BUTTON */

.sticky{
    position:fixed;
    left:10px;
    right:10px;
    bottom:10px;
    z-index:9999;
}

.sticky a{
    display:block;
    text-align:center;
    text-decoration:none;
    color:white;
    background:#1488ed;
    padding:17px 8px;
    border-radius:50px;
    font-size:17px;
    font-weight:800;
    box-shadow:0 8px 25px rgba(0,0,0,.35);
}

/* MOBILE */

@media(max-width:480px){

    body{
        padding:14px 10px 90px;
    }

    h1{
        font-size:32px;
    }

    .subtitle{
        font-size:20px;
    }

    .features{
        gap:15px 8px;
    }

    .feature{
        font-size:14px;
    }

    .check{
        width:39px;
        height:39px;
        min-width:39px;
        font-size:22px;
    }

    .telegram-btn{
        font-size:18px;
    }

    .cta-button{
        font-size:16px;
    }
}

@media(max-width:360px){

    .features{
        grid-template-columns:1fr;
    }

    h1{
        font-size:29px;
    }
}
</style>
</head>
